name : Iris ML API - CI Pipeline - CSE

# define when Github should run this workflow

on:
# run whenever code is pushed to main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# permissions are restricted to read repo content
permissions:
  contents: read
  packages: write

# define the jobs that make up the pipeline
jobs:
# JOB 1: Test
  test:
    name: Run API Tests
    # Github repo provides a fresh Ubuntu venv for this job
    runs-on: ubuntu-latest
  
    steps:
      # step 1 : Download the repo content to the runner
      - name: check out repository
        uses: actions/checkout@v4

      # step2 : Install python on the runner
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
        
      # step3 : Install python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      #step4 : Execute the automated tests
      - name: Run automated tests
        run: python -m pytest -v
      
  # JOB-2: Build and Publish Docker Image
  build-and-publish:
    name: Build and Publish Docker Image
    
    # This job starts only if all tests pass
    needs: test
    runs-on: ubuntu-latest

    # Publish only when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Download repo source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Enable Docker Buildkit Functionality
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Authenticate with GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image names and tags
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw, value=latest
            type=sha, format=short

      # Build the docker image and push it to GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}